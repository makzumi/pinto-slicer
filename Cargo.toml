[package]
name = "pinto_slicer"
version = "0.1.3"
edition = "2021"
description = "Pinto Slicer: a resin 3D printer slicer built with Rust, egui and wgpu"
license = "AGPL-3.0-only"
repository = "https://github.com/makzumi/pinto-slicer"
readme = "README.md"

[dependencies]
eframe = { version = "=0.29.1", features = ["wgpu"] }
egui = "=0.29.1"
image = { version = "=0.25.6", default-features = false, features = ["png"] }
# Established CTB/GOO encoders; the other printer writers live in src/formats.
msla_format = { version = "0.2.0", default-features = false, features = ["ctb", "goo"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Support settings and self-contained project files use serde serialization.
serde = { version = "1", features = ["derive", "rc"] }
bincode = "1"
# Overhang detection and raycast batches run in parallel.
rayon = "1"
egui-phosphor = "0.7.3"
bytemuck = "1"
wgpu = { version = "=22.1.0", default-features = false, features = ["vulkan-portability", "wgsl"] }
egui-wgpu = "=0.29.1"
pollster = "0.3"
rfd = { version = "0.15.4", default-features = false, features = ["tokio", "xdg-portal"] }
tokio = { version = "1", default-features = false, features = ["rt", "time", "sync", "rt-multi-thread"] }

# Only used on macOS: open the window without activating the app.
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

# Debug builds run fast enough to render/slice hundreds of thousands of triangles.
[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
