name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.100.0'

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Validate packaging metadata and scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n packaging/build-appimage.sh packaging/build-macos.sh packaging/build-flatpak.sh packaging/flatpak/update-cargo-sources.sh
          sh -n packaging/AppRun packaging/install-user.sh
          desktop-file-validate packaging/io.github.makzumi.pinto-slicer.desktop
          appstreamcli validate --no-net packaging/io.github.makzumi.pinto-slicer.metainfo.xml
          if command -v pwsh >/dev/null 2>&1; then
              pwsh -NoProfile -Command '
                $errors = $null
                [void][System.Management.Automation.Language.Parser]::ParseFile(
                  "packaging/build-windows.ps1", [ref]$null, [ref]$errors)
                if ($errors) { $errors | Out-String | Write-Error; exit 1 }
              '
          fi

  # The release builds on macOS and Windows; catch platform-specific compile
  # and test failures here instead of on a release tag.
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        # macOS 14 images were retired on 2026-11-02; macos-15 is the current
        # arm64 label and cross-compiles the Intel slice.
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Run tests
        run: cargo test --locked
