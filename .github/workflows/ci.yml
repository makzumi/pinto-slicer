name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.100.0'

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Validate packaging metadata and scripts
        run: |
          bash -n packaging/build-appimage.sh packaging/build-flatpak.sh packaging/flatpak/update-cargo-sources.sh
          sh -n packaging/AppRun packaging/install-user.sh
          desktop-file-validate packaging/io.github.makzumi.pinto-slicer.desktop
          appstreamcli validate --no-net packaging/io.github.makzumi.pinto-slicer.metainfo.xml
